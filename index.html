<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>桃太郎電鐵-地圖攻略6.5(正式版)</title>

  <!-- Leaflet 样式 -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.fullscreen/1.6.0/Control.FullScreen.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-minimap/dist/Control.MiniMap.min.css" />

  <style>
  .leaflet-control-layers-overlays label {
  font-size: 16px;   /* 想要的大小 */
}
    /* 地圖容器 */
    #map {
      height: 600px;
      width: 100%;
      border: 2px solid rgba(51,51,51,0.31);
      overflow: hidden;
      touch-action: none;
    }

    /* 地圖標籤文字 */
    .scroll-map-div-icon-label {
      color: white;
      padding: 4px;
      border-radius: 10px;
      white-space: nowrap;
      text-align: center;
    }

    /* 搜尋容器 */
    .search-box {
      position: absolute;
      bottom: 10px;
      left: 10px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      z-index: 1001;
    }
	    /* 把這段加進來 */
    .bordered-table {
      border-collapse: collapse;
      width: 100%;
    }
    .bordered-table td,
    .bordered-table th {
      border: 1px solid #333;
      padding: 4px 8px;
    }

    /* 搜尋按鈕 */
    #toggleSearchBtn,
    #closeSearchBtn {
      font-size: 24px;
      width: 48px;
      height: 48px;
      border: none;
      border-radius: 8px;
      background: rgba(255,255,255,0.95);
      box-shadow: 0 2px 6px rgba(0,0,0,0.25);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s;
    }

    #toggleSearchBtn:hover,
    #closeSearchBtn:hover {
      transform: scale(1.1);
    }

    /* 搜尋欄容器 */
    #searchContainer {
      display: none;
      margin-top: 6px;
      background: rgba(255,255,255,0.95);
      padding: 6px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
      min-width: 90px;
    }

    #searchContainer input {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      font-size: 16px;
      margin-bottom: 4px;
      border-radius: 4px;
      border: 1px solid #ccc;
    }

    #searchContainer button {
      font-size: 16px;
      margin: 2px 2px 2px 0;
      padding: 3px 6px;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      background: #ffcccc;
    }

    #searchContainer button:hover {
      background: #ddd;
    }

    /* 搜尋結果列表 */
    .search-results {
      max-height: 160px;
      overflow-y: auto;
      margin-top: 4px;
      font-size: 16px;
    }

    .search-results div {
      padding: 4px;
      cursor: pointer;
      border-bottom: 1px solid #ddd;
    }

    .search-results div:hover {
      background: #f0f0f0;
    }
  /* —— 在這裡新增下拉選單字體大小 —— */
  #searchContainer select {
    font-size: 18px;      /* 字體大小，可調整 */
    padding: 6px 8px;     /* 內距 */
    border-radius: 4px;
    border: 1px solid #ccc;
  }
#dropdown2 {
  display: none;
}
/* 下方搜尋框 CSS */
#searchContainerBottom {
  display: none;
  background: rgba(255,255,255,0.95);
  padding: 6px;
  border-radius: 8px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.25);
  min-width: 90px;
}

#searchContainerBottom input,
#searchContainerBottom select,
#searchContainerBottom button {
  font-size: 16px;
}

.search-results#searchResultsBottom div:hover {
  background: #f0f0f0;
}
/* 只放大下方搜尋功能的按鈕 */
#toggleSearchBtnBottom,
#closeSearchBtnBottom {
  font-size: 32px;   /* 放大圖案 */
  width: 60px;       /* 按鈕寬度 */
  height: 60px;      /* 按鈕高度 */
}
/* 下方搜尋框的文字都大一點 */
#searchContainerBottom input,
#searchContainerBottom select,
#searchContainerBottom button {
  font-size: 20px;   /* 調整成你想要的大小 */
}

/* 特別改「清單列表」按鈕顏色 */
#japaneseListBtnBottom {
  background-color: #4172a3;  /* 浅藍色，也可改成其他顏色 */
  color: white;               /* 文字白色 */
  font-weight: bold;
}

#japaneseListBtnBottom:hover {
  background: #5a9bd5;  /* 滑鼠移上去顏色更深 */
}


  </style>
</head>
<body>
<div id="map" style="position: relative;">
  <div class="search-box" id="searchBox">
    <button id="toggleSearchBtn">🔍</button>
    <div id="searchContainer">
      <div style="display:flex;align-items:center;gap:6px;margin-bottom:6px;">
        <button id="closeSearchBtn">🔍↩</button>
        <!-- 下拉選單1 -->
        <select id="dropdown1">
          <option value="station">物件車站</option>
          <option value="market">卡片賣場</option>
          <option value="city">六大都市</option>

		  <option value="monster">名產怪獸</option>

		  <option value="sky">機場車站</option>

        </select>

</div>

        📑 1. 雙基準點情報與路徑規劃

	<div id="base-a-suggestions" class="absolute left-0 right-0 mt-1 bg-white border border-gray-200 rounded-lg shadow-lg z-10 max-h-48 overflow-y-auto hidden"></div>
	</div>
	<button onclick="confirmBase('A')" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-medium transition">
  設定 A

	</div>

            </div>

            <!-- 基準點 B -->

              <div class="flex gap-2">
                <div class="relative flex-1">
	<input type="text" id="base-b-input" placeholder="例如：淡路島" class="w-full px-4 py-2 bg-white border rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500" oninput="onInput('base-b', this.value)" autocomplete="off">

	</div>
	<div id="base-b-status" class="text-xs mt-2 text-emerald-600 font-medium"></div>
            </div>
          <h2 class="text-lg font-bold text-gray-800">🏷️ 雙基準點周邊戰略情報對比</h2>

            <p class="font-bold">💡 【頁籤 2 操作說明】</p>
            <p>1. 自由切換以基準點 A 或 B 作為地點進行多點距離計算與自動排序。</p>
          </div>

<div class="bg-gray-50 border border-gray-200 rounded-lg p-3.5 flex flex-col md:flex-row justify-between items-start md:items-center gap-3">
            <div>
              <span class="text-xs text-gray-500 block font-bold">目前同步啟用的基準點狀態：</span>
              <div class="flex gap-4 mt-1 text-sm">

              </div>
            </div>
            
            <div class="flex items-center gap-4 text-sm">
              <div class="flex items-center gap-1 bg-white p-1 rounded-lg border border-gray-200 shadow-sm">
                <span class="text-xs text-gray-500 px-1 font-bold">計算出發源：</span>
                <button onclick="setMultiDestBase('A')" id="multibase-btn-a" class="px-3 py-1 rounded font-bold text-xs bg-blue-600 text-white transition shadow-sm">基準點 A</button>
                <button onclick="setMultiDestBase('B')" id="multibase-btn-b" class="px-3 py-1 rounded font-bold text-xs text-gray-600 hover:bg-gray-200 transition">基準點 B</button>
              </div>
            </div>
          </div>

          <!-- 帶有即時最近贏家提示的基準描述列 -->
          <div class="flex flex-col md:flex-row justify-between items-start md:items-center bg-blue-50/70 border border-blue-100 p-3 rounded-lg gap-2">
            <p id="multibase-desc" class="text-xs text-blue-800 font-bold">目前計算基準：尚未設定基準點</p>
            <div id="multibase-nearest-winner" class="text-xs text-indigo-700 font-bold bg-white px-3 py-1 rounded-md border border-blue-200 shadow-sm">
              🏆 目前最近：尚未輸入目的地
            </div>
          </div>

          <div>

              ➕ 新增輸入框 (還可加 7 個)
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

    function toggleStrategyCenter() {
      const content = document.getElementById('strategy-center-content');
      const toggle = document.getElementById('strategy-center-toggle');
      const icon = document.getElementById('strategy-center-toggle-icon');
      const isOpening = content.classList.contains('hidden');
      content.classList.toggle('hidden', !isOpening);
      content.setAttribute('aria-hidden', String(!isOpening));
      toggle.setAttribute('aria-expanded', String(isOpening));
      icon.textContent = isOpening ? '－' : '＋';
    }

        };

        this.init(data);
      }

      makeKey(region, x, y) {
        return `[${region}](${x},${y})`;
      }

      init(data) {
        if (!data || !data.regions) return;
        const regions = data.regions;

        for (const [regionName, regionData] of Object.entries(regions)) {
          const regionNodeMap = new Map();

          (regionData.nodes || []).forEach(node => {
            const key = this.makeKey(regionName, node.x, node.y);
            this.nodes.set(key, { ...node, region: regionName });
            this.adjacencyList.set(key, []);
            regionNodeMap.set(`${node.x},${node.y}`, key);

            const displayName = node.label || node.jpname;
            if (displayName && displayName.trim() !== "") {
              this.nameToKeyMap.set(displayName.trim(), key);
            }
          });

          const blockedSet = new Set();
          (regionData.blocked || []).forEach(b => {
            blockedSet.add(`${b.A}-${b.B}`);
            blockedSet.add(`${b.B}-${b.A}`);
          });

          (regionData.nodes || []).forEach(node => {
            const currentKey = this.makeKey(regionName, node.x, node.y);
            const neighbors = [
              { x: node.x + 1, y: node.y },
              { x: node.x - 1, y: node.y },
              { x: node.x, y: node.y + 1 },
              { x: node.x, y: node.y - 1 }
            ];

            neighbors.forEach(nbr => {
              const neighborKey = regionNodeMap.get(`${nbr.x},${nbr.y}`);
              if (neighborKey) {
                const edgeStrA = `(${node.x},${node.y})-(${nbr.x},${nbr.y})`;
                if (!blockedSet.has(edgeStrA)) {
                  this.addEdge(currentKey, neighborKey, 1);
                }
              }
            });
          });

          (regionData.shortcuts || []).forEach(sc => {
            const posA = sc.A.replace(/[()]/g, '').split(',');
            const posB = sc.B.replace(/[()]/g, '').split(',');
            const keyA = this.makeKey(regionName, posA[0], posA[1]);
            const keyB = this.makeKey(regionName, posB[0], posB[1]);
            if (this.nodes.has(keyA) && this.nodes.has(keyB)) {
              this.addEdge(keyA, keyB, 0);
            }
          });
        }

        if (data.inter_region_links) {
          data.inter_region_links.forEach(link => {
            const fromKey = this.makeKey(link.from.region, link.from.x, link.from.y);
            const toKey = this.makeKey(link.to.region, link.to.x, link.to.y);
            if (this.nodes.has(fromKey) && this.nodes.has(toKey)) {
              const weight = link.weight !== undefined ? link.weight : 0;
              this.addEdge(fromKey, toKey, weight);
            }
          });
        }
      }

      addEdge(u, v, weight = 1) {
        if (!this.adjacencyList.has(u)) this.adjacencyList.set(u, []);
        if (!this.adjacencyList.has(v)) this.adjacencyList.set(v, []);

        if (!this.adjacencyList.get(u).some(e => e.node === v)) {
          this.adjacencyList.get(u).push({ node: v, weight });
        }
        if (!this.adjacencyList.get(v).some(e => e.node === u)) {
          this.adjacencyList.get(v).push({ node: u, weight });
        }
      }

      resolveKey(input) {
        const trimmed = input.trim();
        if (this.nodes.has(trimmed)) return trimmed;
        if (this.nameToKeyMap.has(trimmed)) return this.nameToKeyMap.get(trimmed);
        return null;
      }

      getNodeDisplayName(key) {
        const node = this.nodes.get(key);
        if (!node) return key;

        const name = node.label || node.jpname;
        if (name && name.trim() !== "") {
          return name; 
        }

        if (["rail_station", "bank"].includes(node.type)) {
          return ""; 
        }

        const typeDescription = this.typeNames[node.type];
        if (typeDescription) {
          return typeDescription; 
        }

        return `(${node.x},${node.y})`;
      }

      getSuggestions(query) {
        if (!query) return [];
        return Array.from(this.nameToKeyMap.keys()).filter(name => name.includes(query)).slice(0, 6);
      }

      calculateDistances(startKey) {
        const distances = new Map();
        const pq = [];

        this.nodes.forEach((_, key) => {
          distances.set(key, Infinity);
        });

        distances.set(startKey, 0);
        pq.push({ node: startKey, dist: 0 });

        while (pq.length > 0) {
          pq.sort((a, b) => a.dist - b.dist);
          const { node: u, dist: uDist } = pq.shift();

          if (uDist > distances.get(u)) continue;

          const neighbors = this.adjacencyList.get(u) || [];
          for (const edge of neighbors) {
            const v = edge.node;
            const alt = uDist + edge.weight;
            if (alt < distances.get(v)) {
              distances.set(v, alt);
              pq.push({ node: v, dist: alt });
            }
          }
        }
        return distances;
      }

      getNearbyFacilities(distanceCache) {
        if (!distanceCache) return null;
        let nearestCardShop = null, nearestHeli = null;

        for (const [key, dist] of distanceCache.entries()) {
          const node = this.nodes.get(key);
          if (!node || dist === Infinity) continue;
          if (node.type === 'card_shop' && (!nearestCardShop || dist < nearestCardShop.distance)) {
            nearestCardShop = { name: "卡片賣場", key, distance: dist };
          }
          if (node.type === 'heli_station' && (!nearestHeli || dist < nearestHeli.distance)) {
            nearestHeli = { name: "直昇機站", key, distance: dist };
          }
        }
        return { cardShop: nearestCardShop, heliStation: nearestHeli };
      }

      getNearestMajorCities(distanceCache) {
        if (!distanceCache) return [];
        let cities = [];
        for (const [key, dist] of distanceCache.entries()) {
          const node = this.nodes.get(key);
          if (node && node.label && node.label.trim() !== "" && dist < Infinity) {
            cities.push({
              name: this.getNodeDisplayName(key),
              region: node.region,
              distance: dist
            });
          }
        }
        return cities.sort((a, b) => a.distance - b.distance);
      }

      findShortestPath(startKey, destKey) {
        if (!startKey || !destKey || !this.nodes.has(startKey) || !this.nodes.has(destKey)) {
          return { status: 'invalid' };
        }

        const distances = new Map();
        const parentMap = new Map();
        const pq = [];

        this.nodes.forEach((_, key) => {
          distances.set(key, Infinity);
          parentMap.set(key, null);
        });

        distances.set(startKey, 0);
        pq.push({ node: startKey, dist: 0 });

        while (pq.length > 0) {
          pq.sort((a, b) => a.dist - b.dist);
          const { node: u, dist: uDist } = pq.shift();

          if (u === destKey) break;
          if (uDist > distances.get(u)) continue;

          const neighbors = this.adjacencyList.get(u) || [];
          for (const edge of neighbors) {
            const v = edge.node;
            const alt = uDist + edge.weight;

            if (alt < distances.get(v)) {
              distances.set(v, alt);
              parentMap.set(v, u);
              pq.push({ node: v, dist: alt });
            }
          }
        }

        if (distances.get(destKey) === Infinity) {
          return { status: 'unreachable', start: this.getNodeDisplayName(startKey), dest: this.getNodeDisplayName(destKey) };
        }

        const pathKeys = [];
        let curr = destKey;
        while (curr) {
          pathKeys.unshift(curr);
          curr = parentMap.get(curr);
        }

        const pathDisplayNames = [];
        let lastRegion = null;

        pathKeys.forEach(key => {
          const node = this.nodes.get(key);
          const label = this.getNodeDisplayName(key);

          if (node.region !== lastRegion) {
            pathDisplayNames.push(`[${node.region}] ${label}`);
            lastRegion = node.region;
          } else {
            pathDisplayNames.push(label);
          }
        });

        return {
          status: 'success',
          startName: this.getNodeDisplayName(startKey),
          destName: this.getNodeDisplayName(destKey),
          distance: distances.get(destKey),
          pathNames: pathDisplayNames
        };
      }
    }

    const navSystem = new MapGraph(realMapData);
    let autoSortEnabled = true;
    let inputCount = 3;
    const maxInputs = 10;

    let baseAKey = null;
    let baseBKey = null;
    let cacheA = null;
    let cacheB = null;
    let multiDestBase = 'A';

    window.onload = function() {
      const container = document.getElementById('dest-inputs-container');
      for (let i = 1; i <= 3; i++) {

      }
    };

      document.getElementById('tab-content-2').classList.toggle('hidden', tabNum !== 2);

        }
      }
    }

    function onInput(type, val) {
      const box = document.getElementById(`${type}-suggestions`);
      if (!box) return;
      const suggestions = navSystem.getSuggestions(val);
      if (suggestions.length > 0 && val.trim() !== '') {
        box.innerHTML = suggestions.map(name => `<div class="p-2 cursor-pointer suggestion-item" onclick="selectSuggestion('${type}', '${name}')">【 ${name} 】</div>`).join('');

      document.getElementById(`${type}-input`).value = name;

    function confirmBase(target) {
      const val = document.getElementById(`base-${target.toLowerCase()}-input`).value;
      const statusEl = document.getElementById(`base-${target.toLowerCase()}-status`);
      const key = navSystem.resolveKey(val);

      if (!key) {
        statusEl.className = "text-xs mt-2 text-red-600 font-medium";
        statusEl.innerText = `❌ 找不到車站`;
        return;
      }

      const displayName = navSystem.getNodeDisplayName(key);
      const node = navSystem.nodes.get(key);
      statusEl.className = "text-xs mt-2 text-emerald-600 font-medium";
      statusEl.innerText = `✅ 已設定：[${node.region}] ${displayName}`;

      if (target === 'A') {
        baseAKey = key;
        cacheA = navSystem.calculateDistances(key);
        updatePanel('A', displayName, cacheA);
      } else {
        baseBKey = key;
        cacheB = navSystem.calculateDistances(key);
        updatePanel('B', displayName, cacheB);
      }

      updateCombinedRoute();
      updateSyncStatus();
      triggerMultiDestCalculation();
    }

    function updatePanel(target, name, cache) {
      const panel = document.getElementById(`panel-${target.toLowerCase()}`);
      const facilities = navSystem.getNearbyFacilities(cache);
      
      const startKey = target === 'A' ? baseAKey : baseBKey;
      const startNode = navSystem.nodes.get(startKey);
      const regionName = startNode ? startNode.region : '未知地區';
      const colorClass = target === 'A' ? 'text-blue-800' : 'text-emerald-800';

      // 定義您指定的 6 大都市精確座標 Key
      const targetCities = [
        { key: navSystem.makeKey("關東", 5, 6), name: "[關東]東京" },
        { key: navSystem.makeKey("關東", 3, 2), name: "[關東]橫濱" },
        { key: navSystem.makeKey("中部", 2, 3), name: "[中部]名古屋" },
        { key: navSystem.makeKey("近畿", 3, 10), name: "[近畿]大阪" },
        { key: navSystem.makeKey("九州", 4, 14), name: "[九州]博多" },
        { key: navSystem.makeKey("北海道", 8, 11), name: "[北海道]札幌" }
      ];

      // 計算這 6 個都市中距離最近的一個
      let nearestTargetCity = null;
      let minDistance = Infinity;

      targetCities.forEach(city => {
        const dist = cache ? cache.get(city.key) : Infinity;
        if (dist !== undefined && dist < minDistance) {
          minDistance = dist;
          nearestTargetCity = { name: city.name, distance: dist };
        }
      });

      panel.innerHTML = `
        <div class="space-y-2.5">
          <div class="flex justify-between items-start">
            <div>
              <p class="font-bold ${colorClass}">📌 基準點 ${target}：【 ${name} 】</p>
              <p class="text-xs text-gray-500 font-medium mt-0.5">📍 所屬地區：${regionName}</p>
            </div>
            <div class="text-xs text-right">
                <span class="text-base text-gray-500 font-bold block">離最近的六大都市：</span>
                <span class="text-indigo-600 font-bold">${nearestTargetCity ? `${nearestTargetCity.name} (${nearestTargetCity.distance} 步)` : '無'}</span>
            </div>
          </div>
          <hr class="border-gray-200">
          <div class="bg-white p-2.5 rounded border border-gray-200 text-xs">
            💳 最近卡片賣場：<strong>【 ${facilities.cardShop ? navSystem.getNodeDisplayName(facilities.cardShop.key) : '無'} 】</strong> (${facilities.cardShop ? facilities.cardShop.distance + ' 步' : '-'})
          </div>
          <div class="bg-white p-2.5 rounded border border-gray-200 text-xs">
            🚁 最近直昇機站：<strong>【 ${facilities.heliStation ? navSystem.getNodeDisplayName(facilities.heliStation.key) : '無'} 】</strong> (${facilities.heliStation ? facilities.heliStation.distance + ' 步' : '-'})
          </div>
        </div>
      `;
    }

    function updateCombinedRoute() {
      const routePanel = document.getElementById('combined-route-panel');
      if (!baseAKey || !baseBKey) {
        routePanel.innerHTML = `<span class="font-bold text-indigo-900">🔗 A ➔ B 兩點路徑規劃：</span> 請同時設定「基準點 A」與「基準點 B」。`;
        return;
      }

      const res = navSystem.findShortestPath(baseAKey, baseBKey);
      if (res.status === 'unreachable') {
        routePanel.innerHTML = `<span class="font-bold text-amber-800">⚠️ 兩點路徑：</span> 從【 ${res.start} 】無法到達【 ${res.dest} 】！`;
        return;
      }

      if (res.status === 'success') {
        routePanel.innerHTML = `
          <div class="space-y-2">
            <div class="text-left text-xl font-bold text-indigo-700 bg-indigo-50 p-2.5 rounded-lg border border-indigo-200">
               🍀總共需：<span class="text-2xl text-blue-600">${res.distance}</span> 步
            </div>
            <div class="font-bold text-indigo-900 text-sm">
              🚀 路線：【 ${res.startName} 】 ➔ 【 ${res.destName} 】
            </div>
            <div class="text-xs text-gray-700 bg-white p-3 rounded-lg border border-indigo-100 leading-relaxed">
              ${res.pathNames.map(name => {
                if (name.includes("區域切換點")) {
                  return `<span class="bg-blue-100 text-blue-700 font-bold px-1.5 py-0.5 rounded">${name}</span>`;
                }
                return name;
              }).join(' ➔ ')}
            </div>
          </div>
        `;
      }
    }

   function updateSyncStatus() {
      const statusA = document.getElementById('sync-status-a');
      const statusB = document.getElementById('sync-status-b');
      if (baseAKey) {
        const nodeA = navSystem.nodes.get(baseAKey);
        statusA.innerText = `📍 基準點 A：【 [${nodeA.region}] ${navSystem.getNodeDisplayName(baseAKey)} 】`;
      } else {
        statusA.innerText = `📍 基準點 A：尚未設定`;
      }
      
      if (baseBKey) {
        const nodeB = navSystem.nodes.get(baseBKey);
        statusB.innerText = `📍 基準點 B：【 [${nodeB.region}] ${navSystem.getNodeDisplayName(baseBKey)} 】`;
      } else {
        statusB.innerText = `📍 基準點 B：尚未設定`;
      }
    }

    // 建立目的地輸入框（在右側直接預留顯示步數與狀態的標籤）
    function createDestInputRow(index) {
      const div = document.createElement('div');
      div.className = "flex items-center gap-2 relative dest-row";
      div.innerHTML = `
        <div class="relative flex-1">
          <input type="text" placeholder="目的地 ${index}（例如：淡路島、東京...）" 
                 class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 dest-input"
                 oninput="onDestInput(this)" autocomplete="off">

        <!-- 輸入框右側即時顯示距離標籤 -->

    // 多點目的地打字輸入監聽
    function onDestInput(inputEl) {
      const row = inputEl.closest('.dest-row');
      const box = row.querySelector('.dest-suggestions');
      const val = inputEl.value;
      
      const suggestions = navSystem.getSuggestions(val);
      if (suggestions.length > 0 && val.trim() !== '') {
        box.innerHTML = suggestions.map(name => `<div class="p-2 cursor-pointer suggestion-item" onclick="selectDestSuggestion(this, '${name}')">【 ${name} 】</div>`).join('');
        box.classList.remove('hidden');
      } else {
        box.classList.add('hidden');
      }

      triggerMultiDestCalculation();
    }

    // 選擇多點自動補全建議
    function selectDestSuggestion(itemEl, name) {
      const row = itemEl.closest('.dest-row');
      const input = row.querySelector('.dest-input');
      const box = row.querySelector('.dest-suggestions');
      
      input.value = name;
      box.classList.add('hidden');
      triggerMultiDestCalculation();
    }

    // 即時計算各個目的地步數，並於上方顯示最近贏家
    function triggerMultiDestCalculation() {
      const rows = document.querySelectorAll('.dest-row');
      const activeCache = multiDestBase === 'A' ? cacheA : cacheB;
      const activeKey = multiDestBase === 'A' ? baseAKey : baseBKey;
      
      const desc = document.getElementById('multibase-desc');
      const winnerEl = document.getElementById('multibase-nearest-winner');

      if (!activeKey) {
        desc.innerText = `目前計算基準：尚未設定 ${multiDestBase === 'A' ? '基準點 A' : '基準點 B'}`;
        if (winnerEl) winnerEl.innerText = `🏆 目前最近：尚未設定基準點`;
        rows.forEach(row => {
          const badge = row.querySelector('.dest-badge');
          if (badge) {
            badge.className = "dest-badge min-w-[110px] text-center px-3 py-2 bg-gray-100 text-gray-500 text-xs font-bold rounded-lg border border-gray-200";
            badge.innerText = "請先設基準";
          }
        });
        return;
      }

      const activeNode = navSystem.nodes.get(activeKey);
      const activeDisplayName = navSystem.getNodeDisplayName(activeKey);
      desc.innerText = `目前計算基準：以【 [${activeNode.region}] ${activeDisplayName} 】作為地點進行多點距離計算。`;

      let validResults = [];

      rows.forEach(row => {
        const input = row.querySelector('.dest-input');
        const badge = row.querySelector('.dest-badge');
        if (!input || !badge) return;

        const val = input.value.trim();

        if (!val) {
          badge.className = "dest-badge min-w-[110px] text-center px-3 py-2 bg-gray-100 text-gray-500 text-xs font-bold rounded-lg border border-gray-200";
          badge.innerText = "等待輸入";
          return;
        }

        const destKey = navSystem.resolveKey(val);
        if (!destKey) {
          badge.className = "dest-badge min-w-[110px] text-center px-3 py-2 bg-red-50 text-red-600 text-xs font-bold rounded-lg border border-red-200";
          badge.innerText = "❌ 找不到";
        } else if (!activeCache || activeCache.get(destKey) === Infinity) {
          badge.className = "dest-badge min-w-[110px] text-center px-3 py-2 bg-amber-50 text-amber-600 text-xs font-bold rounded-lg border border-amber-200";
          badge.innerText = "⚠️ 不可達";
        } else {
          const dist = activeCache.get(destKey);
          badge.className = "dest-badge min-w-[110px] text-center px-3 py-2 bg-blue-50 text-blue-700 text-xs font-bold rounded-lg border border-blue-200";
          badge.innerText = `⚡ ${dist} 步`;
          
          validResults.push({
            name: navSystem.getNodeDisplayName(destKey),
            distance: dist
          });
        }
      });

      // 更新上方的「目前最近」顯示
      if (winnerEl) {
        if (validResults.length > 0) {
          validResults.sort((a, b) => a.distance - b.distance);
          const nearest = validResults[0];
          winnerEl.innerText = `🏆 目前最近：【 ${nearest.name} 】 (${nearest.distance} 步)`;
          winnerEl.className = "text-xs text-emerald-700 font-bold bg-emerald-50 px-3 py-1 rounded-md border border-emerald-200 shadow-sm";
        } else {
          winnerEl.innerText = `🏆 目前最近：尚無有效目的地`;
          winnerEl.className = "text-xs text-indigo-700 font-bold bg-white px-3 py-1 rounded-md border border-blue-200 shadow-sm";
        }
      }
    }

    // 切換基準點按鈕 (A/B)
    function setMultiDestBase(target) {
      multiDestBase = target;
      const btnA = document.getElementById('multibase-btn-a');
      const btnB = document.getElementById('multibase-btn-b');
      
      if (target === 'A') {
        btnA.className = "px-3 py-1 rounded font-bold text-xs bg-blue-600 text-white transition shadow-sm";
        btnB.className = "px-3 py-1 rounded font-bold text-xs text-gray-600 hover:bg-gray-200 transition";
      } else {
        btnB.className = "px-3 py-1 rounded font-bold text-xs bg-emerald-600 text-white transition shadow-sm";
        btnA.className = "px-3 py-1 rounded font-bold text-xs text-gray-600 hover:bg-gray-200 transition";
      }
      triggerMultiDestCalculation();
    }

    // 新增輸入框按鈕
    function addDestinationInputRow() {
      const container = document.getElementById('dest-inputs-container');
      const currentRows = container.querySelectorAll('.dest-row').length;
      
      if (currentRows >= maxInputs) {
        alert("最多只能新增 10 個輸入框！");
        return;
      }
      
      inputCount = currentRows + 1;
      container.appendChild(createDestInputRow(inputCount));
      updateAddButtonState();

    // 刪除輸入框按鈕
    function removeDestInputRow(btnEl) {
      const container = document.getElementById('dest-inputs-container');
      const currentRows = container.querySelectorAll('.dest-row').length;
      
      if (currentRows <= 1) {
        alert("至少需要保留一個輸入框！");

// 搜尋功能外層收合／展開
function toggleSearchPanelBottom() {
  const content = document.getElementById('search-panel-content-bottom');
  const toggle = document.getElementById('search-panel-toggle-bottom');
  const icon = document.getElementById('search-panel-toggle-icon-bottom');

  const isOpening = content.classList.contains('hidden');

  content.classList.toggle('hidden', !isOpening);
  content.setAttribute('aria-hidden', String(!isOpening));
  toggle.setAttribute('aria-expanded', String(isOpening));
  icon.textContent = isOpening ? '－' : '＋';

  // 展開外層時，自動打開原本的搜尋框
  if (isOpening) {
    toggleSearchBottom(true);
  } else {
    toggleSearchBottom(false);
  }
}

// 下方搜尋框 JS
function toggleSearchBottom(show) {
  document.getElementById('searchContainerBottom').style.display = show ? 'block' : 'none';
  document.getElementById('toggleSearchBtnBottom').style.display = show ? 'none' : 'inline-block';
  if (show) document.getElementById('searchInputBottom').focus();
}

document.getElementById('toggleSearchBtnBottom').onclick = () => toggleSearchBottom(true);
document.getElementById('closeSearchBtnBottom').onclick = () => toggleSearchBottom(false);

document.getElementById('searchInputBottom').addEventListener('input', function () {
  showResultsBottom(this.value.trim());
});

document.getElementById('clearSearchBtnBottom').addEventListener('click', function () {
  // 清空搜尋欄位
  document.getElementById('searchInputBottom').value = "";
  document.getElementById('searchResultsBottom').innerHTML = "";

  // 關閉所有 popup
  activePopups.forEach(p => map.closePopup(p));
  activePopups = [];

  // 清除所有顯示的坐標
  shownCoords.clear();
});

});

// 複製左下功能的 showResults 與 showJapaneseList 函數
function showResultsBottom(keyword) {
  const resultsDiv = document.getElementById('searchResultsBottom');
  resultsDiv.innerHTML = "";
  if (!keyword) return;

  const results = markers.filter(m => m.name.includes(keyword));
  if (results.length === 0) {
    resultsDiv.innerHTML = "<div>找不到結果</div>";
    return;
  }

  results.forEach(r => {
    const div = document.createElement("div");
    div.textContent = r.name;
    div.onclick = function () {
      map.setView(r.coords, 2);
      L.popup().setLatLng(r.coords).setContent("📍 " + r.name).openOn(map);
    };
    resultsDiv.appendChild(div);
  });
}

function showJapaneseListBottom(searchKey) {
  const resultsDiv = document.getElementById('searchResultsBottom');
  resultsDiv.innerHTML = "";
  markers.forEach(m => {
    if (m.marker.posData[searchKey]) {
      const div = document.createElement("div");
      div.textContent = m.name + " (" + m.marker.posData[searchKey] + ")";
      div.onclick = function () {
        map.setView(m.coords, 2);
        L.popup().setLatLng(m.coords).setContent("📍 " + m.name).openOn(map);
      };
      resultsDiv.appendChild(div);
    }
  });
}

// 初始化各分類標記容器
var specificMarkers = {
  A: [], B: [], C: [], D: [], E: [], F: [], G: [],
  H: [], I: [], J: [], K: [], L: [], M: [], N: [], O: [],P: [],R: []
};

// 新增標記函式
function addMarkers(posArr, markerArr) {
  posArr.forEach(pos => {
    var marker = L.marker(pos.coords, { icon: createCustomIcon(pos.label, 10, groupColors[pos.group]) });
    marker.bindPopup(`<strong>${pos.label}</strong><br>${pos.info}`);
    marker.posData = pos;
    markerArr.push(marker);
  });
}

// 將所有位置加入標記容器
Object.keys(positions).forEach(key => addMarkers(positions[key], specificMarkers[key]));

// 建立各個群組
var layerGroups = {};
Object.keys(specificMarkers).forEach(group=>{
  layerGroups[group]=L.layerGroup(specificMarkers[group]);
});

// G 類別特殊標記
// 遍歷每個圖示類別
Object.keys(colocopyMarkers).forEach(iconType => {

// 建立每個 iconType 對應的圖層群組

});

Object.values(layerGroups).forEach(g=>{
  allLayersGroup.addLayer(g);
});

  '好卡片車站':'I','卡片銀行車站':'N','鐵道局車站':'M','八大烏龍麵地點':'K','八大瀑布地點':'L',
  '名產怪獸':'O','機場車站':'P','乘船車站':'R',
};

// 控制項

// 搜尋功能
var markers = [];

// 先加入 specificMarkers 的標記
Object.values(specificMarkers).forEach(arr => {

var activePopups = [];
var shownCoords = new Set();

function showResults(keyword) {
  var resultsDiv = document.getElementById('searchResults');
  resultsDiv.innerHTML = "";

  if (!keyword) return;

  var range = document.getElementById('dropdown2').value;
  var selectedMk = getMkByDropdown2(range);

// showResults
var results = markers.filter(m =>
    m.name.includes(keyword)
);


  if (results.length === 0) {
    resultsDiv.innerHTML = "<div>找不到結果</div>";
    return;
  }

  if (results.length > 1) {
    var openAll = document.createElement("div");
    openAll.textContent = "📍 開啟全部結果";
    openAll.style.fontWeight = "bold";
    openAll.style.background = "#f8f8f8";
    openAll.onclick = function () {
      addAllPopups(results);
    };
    resultsDiv.appendChild(openAll);
  }

  results.forEach(r => {
    var div = document.createElement("div");
    div.textContent = r.name;
    div.onclick = function () {
      addPopup(r);
      map.setView(r.coords, 2);
    };
    resultsDiv.appendChild(div);
  });
}

function showJapaneseList(searchKey) {
  var resultsDiv = document.getElementById('searchResults');
  resultsDiv.innerHTML = "";  // 清空結果

  var selectedMk = getMkByDropdown2(document.getElementById('dropdown2').value);
  var seen = new Set();
  var results = [];

  markers.forEach(m => {
    var label = m.marker.posData.label;
    var data = m.marker.posData[searchKey];  // 根據選擇的 key 篩選資料

    // 判斷 data 是否存在且非空白字串
    if (typeof data !== "undefined" && data.trim() !== "" && !seen.has(label)) {
      // 篩選 dropdown2

    // showJapaneseList
    if (!selectedMk || m.marker.posData.mk.split(',').includes(selectedMk)) {
        seen.add(label);
        results.push({
            name: `${label} (${data})`,
            coords: m.coords,
            marker: m
            });
        }
    }
  });

  if (results.length === 0) {
    resultsDiv.innerHTML = "<div>沒有結果</div>";
    return;
  }

// 過濾重複的位置 (這裡只保留最上面的一個標記)
var uniqueResults = [];
var seenCoords = new Set();

results.forEach(r => {
  var coordKey = r.coords.join(',');  // 以坐標作為唯一標識
  if (!seenCoords.has(coordKey)) {
    uniqueResults.push(r);  // 只保留第一個出現的標記
    seenCoords.add(coordKey);  // 紀錄該坐標
  }
});


  // 如果結果數量大於 1，顯示「開啟全部結果」按鈕
  if (uniqueResults.length > 1) {
    var openAllButton = document.createElement("div");
    openAllButton.textContent = "📍 開啟全部結果";
    openAllButton.style.fontWeight = "bold";
    openAllButton.style.background = "#f8f8f8";
    openAllButton.style.padding = "6px";
    openAllButton.style.cursor = "pointer";
    openAllButton.onclick = function() {
      addAllPopups(uniqueResults);  // 顯示所有唯一的標記
    };
    resultsDiv.appendChild(openAllButton);
  }

  // 顯示搜尋結果
  uniqueResults.forEach(r => {
    var div = document.createElement("div");
    div.textContent = r.name;
    div.onclick = function () {
      addPopup(r);  // 只會開啟唯一位置的第一個標記
      map.setView(r.coords, 2);
    };
    resultsDiv.appendChild(div);
  });
}

function addPopup(r) {
  var key = r.coords.join(',');
  if (shownCoords.has(key)) return;

  var popup = L.popup({
    autoClose: false,
    closeOnClick: false
  })
    .setLatLng(r.coords)
    .setContent("📍 " + r.name)
    .openOn(map);

  popup.on('remove', function() {
    shownCoords.delete(key);  // 當 popup 被關掉時，從 shownCoords 移除
    activePopups = activePopups.filter(p => p !== popup); // 同步 activePopups
  });

  activePopups.push(popup);
  shownCoords.add(key);
}

function addAllPopups(results) {
  var bnds = [];

  results.forEach(r => {
    var key = r.coords.join(',');

    // 已經開過的座標就略過，避免重複開啟
    if (shownCoords.has(key)) return;

    var popup = L.popup({
      autoClose: false,
      closeOnClick: false
    })
      .setLatLng(r.coords)
      .setContent("📍 " + r.name)
      .openOn(map);

    // 監聽移除時，清理追蹤
    popup.on('remove', function () {
      shownCoords.delete(key);
      activePopups = activePopups.filter(p => p !== popup);
    });

    activePopups.push(popup);
    shownCoords.add(key);
    bnds.push(r.coords);
  });

  if (bnds.length > 1) {
    map.fitBounds(bnds);
  }
}

function toggleSearch(show) {
  document.getElementById('searchContainer').style.display = show ? 'block' : 'none';
  document.getElementById('toggleSearchBtn').style.display = show ? 'none' : 'inline-block';
  if (show) document.getElementById('searchInput').focus();

  setTimeout(() => {
    map.invalidateSize();
  }, 50);
}

document.getElementById('closeSearchBtn').onclick = () => toggleSearch(false);

document.getElementById('searchInput').addEventListener('input', function () {

});

document.getElementById('clearSearchBtn').addEventListener('click', function () {

  document.getElementById('searchInput').value = "";

  // 關閉所有 popup
  activePopups.forEach(p => map.closePopup(p));
  activePopups = [];

  // 清除所有顯示的坐標
  shownCoords.clear();

});

function getMkByDropdown2(value) {

  const selectedOption = [...dropdown2.options].find(option => option.value === value);
  return selectedOption ? selectedOption.dataset.mk : null;
}
